name: archovive-public-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  boundary-and-cli:
    name: boundary-and-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public package
        run: pip install -e ".[dev]"

      - name: Public repo boundary
        run: bash scripts/verify_public_boundary.sh

      - name: Unit tests
        run: python -m pytest archovive/tests -q

      - name: CLI help smoke
        run: |
          archovive --help
          archovive --version
          archovive doctor
          archovive evidence --help
          archovive camera operator --help
          archovive mcp --help

      - name: Engine commands show bundle message
        run: |
          archovive run 2>&1 | grep -q "product bundle"
          archovive evidence flask 2>&1 | grep -q "product bundle"

      - name: Release manifest checksums present
        run: |
          test -f releases/archovive-enterprise-5.0.0.zip.sha256
          test -f releases/build_manifest.json
          test -f RELEASE.lock.json
          grep -q 'bundle_sha256' RELEASE.lock.json

      - name: Policy pack registry paths
        run: |
          python3 -c "
import json
reg = json.load(open('policy_packs/registry.json'))
for p in reg.get('packs', []):
    path = p.get('path', '')
    assert not path.startswith('golden/'), path
    assert path.startswith('policy_packs/'), path
print('registry OK')
"
