name: archovive-public-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  oss-product:
    name: oss-product
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OSS CLI
        run: pip install -e internal/[dev]

      - name: Public repo boundary
        run: bash internal/scripts/verify_public_boundary.sh

      - name: Unit tests
        run: python -m pytest archovive/tests -q

      - name: OSS funnel — simulate
        run: |
          export PATH="$PWD/dist:$PATH"
          archovive simulate | grep -q "POLICY_VIOLATION"
          archovive simulate --json | grep -q "fee879ce6ea2d29634bde4f5f2d738e37a0bf409fb200d1d52009c1cd0c734aa"

      - name: OSS funnel — ci check exit code
        run: |
          export PATH="$PWD/dist:$PATH"
          archovive ci check || test $? -eq 2

      - name: CLI smoke
        run: |
          export PATH="$PWD/dist:$PATH"
          archovive --help
          archovive --version
          archovive doctor

      - name: Enterprise commands require bundle
        run: |
          export PATH="$PWD/dist:$PATH"
          run_out="$(archovive run 2>&1 || true)"
          echo "$run_out" | grep -q "product bundle"

      - name: Internal release pins
        run: |
          test -f internal/releases/archovive-enterprise-5.0.0.zip.sha256
          test -f internal/RELEASE.lock.json
          grep -q 'bundle_sha256' internal/RELEASE.lock.json

      - name: Policy pack registry (internal)
        run: bash internal/scripts/verify_policy_registry.sh
