[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archovive"
version = "5.0.0"
description = "Archovive OSS CLI — simulate demo and open-core router"
readme = "PACKAGE.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
archovive = "cli.cli_main:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["cli*", "simulate*"]

[tool.pytest.ini_options]
testpaths = ["../cli/tests", "../tests"]
