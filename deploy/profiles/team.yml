# Team tier — optional decision-api

The decision-api Docker image is built from **Archovive-core** (private engine repo).
This public repo ships the frozen CLI bundle only.

Team workflow without Docker:

```bash
source ./archovive.env
export ARCHOVIVE_PRODUCT=team
archovive gate
archovive team feed
```

Env template: `deploy/profiles/.env.team.example`
